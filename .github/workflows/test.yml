name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          
      - name: Lint
        run: |
          ruff check .
          
      - name: Format check
        run: |
          ruff format --check .
          
      - name: Type check
        run: |
          python -m mypy --strict divi_migrator
          
      - name: Unit tests
        run: |
          pytest tests/unit/ -v --tb=short