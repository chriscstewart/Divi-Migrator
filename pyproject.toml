[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "divi-migrator"
version = "0.1.4"
description = "Migrate WordPress Avada / Plain HTML / Others? → Divi 5 Theme Framework. Vibe Coded (be warned!), built for AI-assisted workflows."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Divi-Migrator Contributors"}
]
maintainers = [
    {name = "Divi-Migrator Contributors"}
]
keywords = [
    "wordpress",
    "divi",
    "divi5",
    "migration",
    "avada",
    "fusion-builder",
    "wp-rest-api"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "tenacity>=8.2.0",
    "jsonschema>=4.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff==0.16.4",
    "mypy==2.3.0",
    "pre-commit>=3.6.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/chriscstewart/Divi-Migrator"
Repository = "https://github.com/chriscstewart/Divi-Migrator"
Issues = "https://github.com/chriscstewart/Divi-Migrator/issues"
Documentation = "https://chriscstewart.github.io/Divi-Migrator/"

[project.scripts]
divi-migrate = "divi_migrator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["divi_migrator"]

[tool.hatch.build.targets.sdist]
include = [
    "/divi_migrator",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/examples",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W", "C", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "ICN", "PIE", "PT", "Q", "RET", "SIM", "SLF", "TRY", "ARG", "PTH", "ERA", "PL", "NPY", "B007", "B008", "B009", "B011", "B015",
]
ignore = []
per-file-ignores = { "tests/*" = ["S101", "S106", "ARG001", "ARG002", "ARG005", "PLC0415", "PLR0913", "SLF001", "PLR2004", "E501"], "tests/unit/_harness.py" = ["ARG001", "ARG002", "PLC0415", "PLR0913", "PLR0911"], "divi_migrator/testing/*" = ["ARG001", "ARG002", "PLC0415", "PLR0913", "PLR0911", "PLR2004"], "scripts/*" = ["T201", "PTH201"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
explicit_package_bases = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["divi_migrator"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.hatch.envs.default]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "tenacity>=8.2.0",
    "jsonschema>=4.17.0",
]